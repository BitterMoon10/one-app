<!doctype html>
<html lang="en" data-theme="pirate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我</title>
    <script>
      // 主题（pirate/cyber）在首帧前恢复，避免换装后刷新闪白
      (function() {
        try {
          const theme = window.localStorage.getItem('zql-theme');
          document.documentElement.setAttribute(
            'data-theme',
            theme === 'cyber' ? 'cyber' : 'pirate'
          );
        } catch (e) {
          /* localStorage 不可用时保持默认 pirate */
        }
      })();
    </script>
    <script>
      // SPA redirect handling for custom domain
      (function() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
          const decoded = decodeURIComponent(redirect);
          window.history.replaceState(null, null, decoded);
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CXvwO8XD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ByAektFC.css">
  </head>

    <div id="root"></div>
  </body>
</html>
